name: API tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Run pytest and Schemathesis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest -v --junitxml=pytest-results.xml

      - name: Run Schemathesis CLI against a live server
        run: |
          uv run --locked uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT

          curl --silent --fail --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8000/openapi.json > /dev/null

          uv run --locked schemathesis run http://127.0.0.1:8000/openapi.json \
            --max-examples 50 \
            --report vcr \
            --report-dir schemathesis-report

      - name: Upload test artefacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            pytest-results.xml
            schemathesis-report/
            uvicorn.log
          if-no-files-found: warn
          retention-days: 14
